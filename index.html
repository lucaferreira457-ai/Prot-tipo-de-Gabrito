<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabarito do martelo – AR</title>
  <script type="module" src="model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#eef1f4}
    model-viewer{width:100%;height:100%;--poster-color:transparent}
    #ar-btn{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
      padding:14px 26px;font-size:17px;font-weight:600;border:0;border-radius:999px;
      background:#1f6feb;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
    #info{position:absolute;top:12px;left:16px;right:16px;font-size:14px;color:#333;pointer-events:none}
  </style>
</head>
<body>
  <model-viewer src="gabarito.glb" alt="Gabarito para montagem do martelo"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls auto-rotate shadow-intensity="1" exposure="0.9" environment-image="neutral">
    <button slot="ar-button" id="ar-btn">Ver em AR (tamanho real)</button>
  </model-viewer>
  <div id="info"><b>Gabarito do martelo</b> · 221 × 132 × 409 mm</div>
</body>
</html>
